global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: heartbeat-consumer
    # DNS service discovery rather than a static target, so scraping
    # still finds every replica when the consumer is scaled.
    dns_sd_configs:
      - names:
          - consumer
        type: A
        port: 8000

  - job_name: heartbeat-notifier
    static_configs:
      - targets:
          - notifier:9091

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
