# Used with docker-compose.load.yml, where scaled workers run as the
# consumer-worker service alongside the base consumer.

global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: heartbeat-consumer
    dns_sd_configs:
      - names:
          - consumer
          - consumer-worker
        type: A
        port: 8000

  - job_name: heartbeat-notifier
    static_configs:
      - targets:
          - notifier:9091

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
