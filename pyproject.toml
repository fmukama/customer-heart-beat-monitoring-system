[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "real-time-heartbeat-monitoring"
version = "0.1.0"
description = "Production-oriented real-time customer heart-rate monitoring pipeline"
requires-python = ">=3.11"

dependencies = [
    "kafka-python>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "jsonschema>=4.23.0",
    "prometheus-client>=0.21.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]


[tool.setuptools.packages.find]
include = [
    "simulator*",
    "producer*",
    "consumer*",
    "notifier*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]

# Integration tests need a running stack, so they are opt-in.
addopts = "-m 'not integration'"

markers = [
    "integration: requires a running docker compose stack",
]

# kafka-python warns about its own default serializers on every client.
filterwarnings = [
    'ignore:.*does not implement kafka.serializer.*:DeprecationWarning',
]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Windows bind mounts present every file as executable inside the container.
ignore = ["EXE002"]
