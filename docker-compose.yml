services:

  # ============================================================
  # Kafka - KRaft mode
  # ============================================================

  kafka:
    image: apache/kafka:4.0.0
    container_name: heartbeat-kafka

    ports:
      - "${KAFKA_PORT:-9092}:9092"

    environment:
      # -------------------------
      # KRaft
      # -------------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # -------------------------
      # Listeners
      # -------------------------
      # INTERNAL serves in-network clients, EXTERNAL serves the host.
      # Each side must be advertised an address reachable from where it runs.
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # -------------------------
      # Single-node development
      # -------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_MIN_INSYNC_REPLICAS: 1

      # -------------------------
      # General
      # -------------------------
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - heartbeat_network


  # ============================================================
  # Topic creation - runs once, then exits
  # ============================================================

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: heartbeat-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for topic in heart-rate-events heart-rate-events-dlq; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions ${KAFKA_TOPIC_PARTITIONS:-3} \
            --replication-factor ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list

    networks:
      - heartbeat_network


  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:17
    container_name: heartbeat-postgres

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heartbeat}
      POSTGRES_USER: ${POSTGRES_USER:-heartbeat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heartbeat_password}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-heartbeat_user} -d ${POSTGRES_DB:-heartbeat}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - heartbeat_network


  # ============================================================
  # Dev tooling - lint and tests
  # ============================================================

  dev:
    build:
      context: .
      target: dev
    image: heartbeat-dev:latest

    profiles: ["tools"]

    # Bind-mounted so edits apply without a rebuild.
    volumes:
      - .:/app

    networks:
      - heartbeat_network


  # ============================================================
  # Simulator - prints raw events, no Kafka
  # ============================================================

  simulator:
    build:
      context: .
      target: runtime
    image: heartbeat-app:latest
    container_name: heartbeat-simulator

    profiles: ["tools"]

    command: ["python", "-m", "simulator"]

    networks:
      - heartbeat_network


  # ============================================================
  # Producer - simulator piped into Kafka
  # ============================================================

  producer:
    build:
      context: .
      target: runtime
    image: heartbeat-app:latest
    container_name: heartbeat-producer

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    # A pipe cannot cross container boundaries, so the generator runs
    # alongside the producer here.
    command:
      - /bin/sh
      - -c
      - python -m simulator | python -m producer.producer

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_HEART_RATE_TOPIC: ${KAFKA_HEART_RATE_TOPIC:-heart-rate-events}
      KAFKA_ACKS: ${KAFKA_ACKS:-all}
      KAFKA_RETRIES: ${KAFKA_RETRIES:-5}
      KAFKA_LINGER_MS: ${KAFKA_LINGER_MS:-5}
      KAFKA_BATCH_SIZE: ${KAFKA_BATCH_SIZE:-16384}
      KAFKA_COMPRESSION_TYPE: ${KAFKA_COMPRESSION_TYPE:-gzip}

    restart: on-failure

    networks:
      - heartbeat_network


  # ============================================================
  # Consumer - Kafka to PostgreSQL
  # ============================================================

  consumer:
    build:
      context: .
      target: runtime
    image: heartbeat-app:latest
    container_name: heartbeat-consumer

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

    command: ["python", "-m", "consumer.consumer"]

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_HEART_RATE_TOPIC: ${KAFKA_HEART_RATE_TOPIC:-heart-rate-events}
      KAFKA_HEART_RATE_DLQ_TOPIC: ${KAFKA_HEART_RATE_DLQ_TOPIC:-heart-rate-events-dlq}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-heartbeat-consumer-group}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      KAFKA_ENABLE_AUTO_COMMIT: ${KAFKA_ENABLE_AUTO_COMMIT:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-heartbeat}
      POSTGRES_USER: ${POSTGRES_USER:-heartbeat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heartbeat_password}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:-4}

    restart: on-failure

    networks:
      - heartbeat_network


  # ============================================================
  # Prometheus
  # ============================================================

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: heartbeat-prometheus

    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    depends_on:
      - kafka

    networks:
      - heartbeat_network


  # ============================================================
  # Grafana
  # ============================================================

  grafana:
    image: grafana/grafana:12.1.0
    container_name: heartbeat-grafana

    ports:
      - "${GRAFANA_PORT:-3000}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_password}

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - heartbeat_network


# ==============================================================
# Persistent volumes
# ==============================================================

volumes:
  kafka_data:
  postgres_data:
  prometheus_data:
  grafana_data:


# ==============================================================
# Network
# ==============================================================

networks:
  heartbeat_network:
    driver: bridge
